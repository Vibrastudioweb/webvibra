<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>EscolApp — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* EscolApp — demo genérica de colegio. Layout: barra de demo arriba; roles móviles dentro de un teléfono con guía lateral; roles de escritorio con menú lateral. */
:root{
  --font-d:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F3F3F5;--surface:#FFFFFF;--surface-2:#F7F5F7;--ink:#1F1417;--ink-2:#5C5258;--line:#E4E0E3;
  --brand:#1F3F8F;--brand-d:#15265C;--on-brand:#FFFFFF;--brand-ink:#1F3F8F;
  --oro:#F2BE1A;--oro-soft:#FBE7A8;--on-oro:#2A1E00;
  --ok:#1E7A4A;--rev:#1F5FA8;--pend:#8A6A00;--part:#6B46A8;--late:#C62828;
  --shadow:0 1px 2px rgba(31,20,23,.06),0 8px 24px rgba(31,20,23,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151113;--surface:#1F191C;--surface-2:#271F23;--ink:#F4EDEF;--ink-2:#B5A9AE;--line:#372E33;
  --brand:#5E82DA;--brand-d:#13224D;--brand-ink:#8FB4EE;
  --ok:#5CC08A;--rev:#7FB3F0;--pend:#F2BE1A;--part:#B79BEB;--late:#F2736F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151113;--surface:#1F191C;--surface-2:#271F23;--ink:#F4EDEF;--ink-2:#B5A9AE;--line:#372E33;
  --brand:#5E82DA;--brand-d:#13224D;--brand-ink:#8FB4EE;
  --ok:#5CC08A;--rev:#7FB3F0;--pend:#F2BE1A;--part:#B79BEB;--late:#F2736F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--ink-2)}
.sm{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}

/* ---------- Barra de demo ---------- */
.bar{flex:none;background:var(--brand-d);color:#fff;border-bottom:3px solid var(--oro);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:30px;height:auto;flex:none}
.brand b{font-family:var(--font-d);font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;opacity:.8;line-height:1.1}
.fict{font-size:12.5px;font-weight:600;background:var(--oro);color:var(--on-oro);padding:3px 10px;border-radius:999px;white-space:nowrap}
.seg{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%;background:rgba(255,255,255,.12);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:7px 11px;border-radius:9px;font-weight:600;font-size:13.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--oro);color:var(--on-oro)}
@media (max-width:640px){.brand small,.fict{display:none}.seg{margin-left:0;width:100%}}

/* ---------- Escenario móvil ---------- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch}
body[data-kind="desk"] .stage{display:none}
.guide{display:none}
.phone{display:flex;flex-direction:column;width:100%;min-height:0;background:var(--bg);position:relative}
.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:14px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
.top{flex:none;background:var(--brand);color:var(--on-brand);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background-image:linear-gradient(112deg,transparent 0 80%,rgba(242,190,26,.9) 80% 82%,transparent 82%);display:flex;align-items:center;gap:12px}
.top img{width:34px;height:auto;flex:none}
.top h1{font-size:18px}
.top small{display:block;opacity:.85;font-size:12.5px}
.top .sp{margin-left:auto}
.kids{display:flex;gap:6px}
.kid{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px}
.kid[aria-pressed="true"]{background:var(--oro);border-color:var(--oro);color:var(--on-oro)}
.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:9px 2px 8px;font-size:11.5px;font-weight:600;color:var(--ink-2);position:relative}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--brand-ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--oro)}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--late);border:2px solid var(--surface)}
@media (min-width:900px){
  .stage{gap:44px;padding:22px;justify-content:center}
  .guide{display:block;width:310px;align-self:center}
  .phone{width:392px;flex:none;max-height:840px;align-self:center;height:100%;border-radius:34px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
}

/* ---------- Componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.flat{background:var(--surface-2)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec h2{font-size:17px}
.link{border:0;background:none;color:var(--brand-ink);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 16px;font-weight:700;min-height:44px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.gold{background:var(--oro);border-color:var(--oro);color:var(--on-oro)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.chip.rev{color:var(--rev);background:color-mix(in srgb,var(--rev) 13%,var(--surface))}
.chip.pend{color:var(--pend);background:color-mix(in srgb,var(--oro) 22%,var(--surface))}
.chip.part{color:var(--part);background:color-mix(in srgb,var(--part) 13%,var(--surface))}
.chip.late{color:var(--late);background:color-mix(in srgb,var(--late) 13%,var(--surface))}
.chip.plain::before{display:none}
.etapa{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--oro);color:var(--pend);background:color-mix(in srgb,var(--oro) 16%,var(--surface));padding:1px 8px;border-radius:6px;vertical-align:middle}
.etapa.e1{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none;background:var(--surface-2);color:var(--brand-ink);border:1px solid var(--line)}
.av.c1{background:color-mix(in srgb,var(--oro) 28%,var(--surface));color:var(--on-oro)}
.av.c2{background:color-mix(in srgb,var(--brand) 14%,var(--surface))}
.av.c3{background:color-mix(in srgb,var(--ink) 9%,var(--surface));color:var(--ink)}
.big{font-family:var(--font-d);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.bars{display:flex;gap:3px;height:10px}
.bars i{display:block;border-radius:1px;min-width:2px}
.i-ok{background:var(--ok)}.i-rev{background:var(--rev)}.i-pend{background:var(--oro)}.i-part{background:var(--part)}.i-late{background:var(--late)}
.prog{height:8px;background:var(--line);border-radius:1px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:1px}
.empty{text-align:center;color:var(--ink-2);padding:26px 14px;border:1px dashed var(--line);border-radius:14px}
.tip{background:color-mix(in srgb,var(--oro) 20%,var(--surface));border:1px solid var(--oro);border-radius:14px;padding:12px 14px;font-size:13.5px}
.tip b{font-family:var(--font-d)}
.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;width:100%}
.item .grow b{display:block}
.unread::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--late);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.copy{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13.5px}
.copy span{overflow-wrap:anywhere}
.mk{display:inline-flex;gap:4px}
.mk button{width:36px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:800;font-size:13px}
.mk button[aria-pressed="true"].P{background:var(--ok);border-color:var(--ok);color:#fff}
.mk button[aria-pressed="true"].A{background:var(--late);border-color:var(--late);color:#fff}
.mk button[aria-pressed="true"].R{background:var(--oro);border-color:var(--oro);color:var(--on-oro)}
.mk button[aria-pressed="true"].J{background:var(--rev);border-color:var(--rev);color:#fff}
.mk button[aria-pressed="true"].bien{width:auto;padding:0 8px;background:var(--ok);border-color:var(--ok);color:#fff}
.mk button.bien,.mk button.poco,.mk button.no,.mk button.si{width:auto;padding:0 9px;font-size:12.5px}
.mk button[aria-pressed="true"].poco{background:var(--oro);border-color:var(--oro);color:var(--on-oro)}
.mk button[aria-pressed="true"].no{background:var(--late);border-color:var(--late);color:#fff}
.mk button[aria-pressed="true"].si{background:var(--ok);border-color:var(--ok);color:#fff}
.sub{display:flex;gap:6px;overflow-x:auto}
.sub button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
.sub button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
label.f{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;color:var(--ink);font-weight:500}
textarea.in{min-height:84px;resize:vertical}
.form{display:grid;gap:12px}
.err{color:var(--late);font-size:13px;font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:0}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start;border-top:4px solid var(--oro)}
.sheet h2{font-size:20px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:90%}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:min(440px,calc(100% - 32px));box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.rcpt{border:1px dashed var(--ink-2);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--surface-2)}
.rcpt .hd{display:flex;gap:10px;align-items:center}
.rcpt .hd img{width:32px}
.photo{aspect-ratio:4/3;border-radius:10px;background:repeating-linear-gradient(0deg,transparent 0 21px,color-mix(in srgb,var(--rev) 35%,transparent) 21px 22px),var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:13px;position:relative;overflow:hidden}
.photo b{font-family:var(--font-d);font-size:16px;color:var(--ink);transform:rotate(-3deg);background:var(--oro-soft);color:#3a2a00;padding:2px 10px}
.shot{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:grid;gap:6px;font-size:13.5px}
.wa{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#E7F4E4;color:#14301c;font-size:13.5px;overflow-wrap:anywhere}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{background:#1d3a28;color:#dcf3e1}}
:root[data-theme="dark"] .wa{background:#1d3a28;color:#dcf3e1}

/* ---------- Escritorio (Administración y Dirección) ---------- */
.desk{flex:1;min-height:0;display:none}
body[data-kind="desk"] .desk{display:grid;grid-template-columns:240px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.side .org{display:flex;gap:10px;align-items:center;padding:0 6px 14px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.side .org img{width:38px}
.side .org b{font-family:var(--font-d);font-size:16px;display:block;line-height:1.1}
.side .org small{color:var(--ink-2);font-size:12px}
.sbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-weight:600;color:var(--ink-2);text-align:left;font-size:14.5px;width:100%}
.sbtn svg{width:19px;height:19px;flex:none}
.sbtn[aria-current="page"]{background:color-mix(in srgb,var(--oro) 24%,var(--surface));color:var(--ink)}
.sbtn .n{margin-left:auto;background:var(--brand);color:var(--on-brand);font-size:11.5px;border-radius:999px;padding:1px 8px}
.sfoot{margin-top:auto;padding:12px 8px 0;font-size:12px;color:var(--ink-2)}
.dmain{overflow:auto;padding:24px max(28px,env(safe-area-inset-right,0px)) 48px max(28px,env(safe-area-inset-left,0px));min-width:0}
.dwrap{max-width:1120px;margin:0 auto;display:grid;gap:16px}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.dhead h1{font-size:28px}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.met{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px}
.met .big{font-size:28px}
.g2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tw{overflow-x:auto;padding:0}
.tbl{width:100%;min-width:640px;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .who{display:flex;gap:10px;align-items:center;font-weight:700;min-width:0}
.tbl .who small{display:block;font-weight:500;color:var(--ink-2)}
.tbl td.r,.tbl th.r{text-align:right}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.filters label.f{min-width:130px}
.filters .in{min-height:40px;padding:7px 10px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:13.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start}
.lv h3{font-size:18px}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stg{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);display:grid;gap:6px;align-content:start;font-size:14px}
.stg ul{margin:0;padding-left:18px;display:grid;gap:3px}
.matrix{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix th{background:var(--surface-2);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.yes{color:var(--ok);font-weight:800}.no{color:var(--ink-2)}
.log{display:grid;gap:0;font-size:13.5px}
.log div{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.log div:last-child{border-bottom:0}
.step{display:flex;gap:10px;align-items:center}
.step i{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;flex:none}
@media (max-width:899px){
  body[data-kind="desk"] .desk{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .side .org,.sfoot{display:none}
  .sbtn{white-space:nowrap;padding:9px 12px;width:auto}
  .dmain{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .g2,.g3,.levels,.stages{grid-template-columns:minmax(0,1fr)}
  .dhead h1{font-size:23px}
}

/* ---------- Guía lateral ---------- */
.guide h2{font-size:22px;margin-bottom:10px}
.guide ol{padding-left:0;list-style:none;display:grid;gap:12px;margin:0 0 16px}
.guide li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.guide li i{width:24px;height:24px;border-radius:50%;background:var(--oro);color:var(--on-oro);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12.5px;flex:none;margin-top:1px}
.guide .note{font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Visor de cámara (cantina) */
.cam{position:relative;height:150px;margin:10px 0 6px;border-radius:14px;background:#17110F;overflow:hidden;display:grid;place-items:end center;padding-bottom:10px}
.cam small{color:#fff;opacity:.8;font-size:12.5px;font-weight:600;position:relative}
.cam i{position:absolute;width:30px;height:30px;border:0 solid var(--oro)}
.cam .c1{top:22px;left:calc(50% - 56px);border-width:4px 0 0 4px;border-top-left-radius:8px}
.cam .c2{top:22px;right:calc(50% - 56px);border-width:4px 4px 0 0;border-top-right-radius:8px}
.cam .c3{top:88px;left:calc(50% - 56px);border-width:0 0 4px 4px;border-bottom-left-radius:8px;top:76px}
.cam .c4{top:76px;right:calc(50% - 56px);border-width:0 4px 4px 0;border-bottom-right-radius:8px}
.cam .ln{position:absolute;left:calc(50% - 50px);width:100px;height:2px;background:var(--oro);top:50px;box-shadow:0 0 8px var(--oro);animation:scan 2s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(-22px)}to{transform:translateY(22px)}}
@media (prefers-reduced-motion:reduce){.cam .ln{animation:none}}

.chip.rej{color:var(--late);background:color-mix(in srgb,var(--late) 13%,var(--surface))}

</style>

<script>
const LOGO='data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 22%27%3E%3Crect x=%270%27 y=%270%27 width=%2715%27 height=%274%27 fill=%27%23F2BE1A%27/%3E%3Crect x=%2717%27 y=%270%27 width=%2711%27 height=%274%27 fill=%27%231F3F8F%27/%3E%3Crect x=%273%27 y=%276%27 width=%279%27 height=%274%27 fill=%27%23C21E4B%27/%3E%3Crect x=%2714%27 y=%276%27 width=%2714%27 height=%274%27 fill=%27%236CC2E8%27/%3E%3Crect x=%270%27 y=%2712%27 width=%2712%27 height=%274%27 fill=%27%232F7D3C%27/%3E%3Crect x=%2714%27 y=%2712%27 width=%278%27 height=%274%27 fill=%27%23EC6C96%27/%3E%3Crect x=%2724%27 y=%2712%27 width=%274%27 height=%274%27 fill=%27%23E5573E%27/%3E%3Crect x=%274%27 y=%2718%27 width=%2714%27 height=%274%27 fill=%27%231D7A8C%27/%3E%3Crect x=%2720%27 y=%2718%27 width=%278%27 height=%274%27 fill=%27%23F2BE1A%27/%3E%3C/svg%3E';
'use strict';
/* ---------- Utilidades ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mkrng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const R=mkrng(20261021);
const pick=a=>a[Math.floor(R()*a.length)];
function fnum(n,d){d=d==null?2:d;const neg=n<0;n=Math.abs(n);let s=n.toFixed(d);let p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(neg?'-':'')+p.join(',')}
const usd=n=>'$'+fnum(n);
const bs=n=>'Bs '+fnum(n);
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ---------- Estructura del colegio ---------- */
const LV=[
  {k:'pre',n:'Preescolar',g:['1er nivel','2do nivel']},
  {k:'pri',n:'Primaria',g:['1er grado','2do grado','3er grado','4to grado','5to grado','6to grado']},
  {k:'bach',n:'Bachillerato',g:['1er año','2do año','3er año','4to año','5to año']}
];
const LETTERS=['A','B','C'];
const SEC=[];
LV.forEach((lv,li)=>lv.g.forEach((g,gi)=>LETTERS.forEach(s=>SEC.push({id:SEC.length,li,gi,g,s,k:lv.k,lv:lv.n,name:g+' '+s,full:(lv.k==='pre'?'Preescolar ':'')+g+' · Sección '+s}))));
const secName=id=>(SEC[id].k==='pre'?'Preescolar ':'')+SEC[id].name;
const SID={pre2A:3,pri4A:15,bach3B:31};

/* ---------- Estudiantes ficticios (20 por sección) ---------- */
const FG=['Sofía','Valentina','Isabella','Camila','Daniela','Mariana','Andrea','Gabriela','Luciana','Victoria','Samantha','Paola','Ariana','Alejandra','Fabiana','Génesis','Nicole','Mía','Emma','Abigail','Sara','Karla','Lucía','Renata'];
const FB=['Mateo','Santiago','Sebastián','Daniel','Samuel','Alejandro','Diego','Emmanuel','David','Gabriel','Andrés','Carlos','Luis','José','Miguel','Adrián','Joaquín','Ángel','Kevin','Jesús','Rafael','Julián','Ricardo','Bruno'];
const LN=['Rivas','Méndez','Pérez','González','Rodríguez','Torres','Briceño','Sánchez','Mora','Araujo','Contreras','Quintero','Salas','Peña','Montilla','Albornoz','Fernández','Ramírez','Linares','Dávila','Carrasquero','Uzcátegui','Peraza','Balza','Paredes','Rangel','Materán','Villegas','Cardozo','Ocanto'];
const RF=['Carolina','María','Yenny','Luisa','Mariela','Yolimar','Karina','Gladys','Marlene','Zulay','Daniela','Rosa','Beatriz','Nancy'];
const RM=['Luis','José','Carlos','Pedro','Ramón','Jorge','Henry','Wilmer','Édgar','Freddy','Manuel','Víctor'];
const ST=[];
SEC.forEach(sc=>{for(let i=0;i<20;i++){
  const girl=R()<.5,fn=pick(girl?FG:FB),l1=pick(LN),l2=pick(LN);
  const rep=(R()<.7?pick(RF):pick(RM))+' '+l1;
  ST.push({id:ST.length,sec:sc.id,i,fn,ln:l1+' '+l2,name:fn+' '+l1+' '+l2,rep});
}});
const KID={val:303,mat:65,est:627};
Object.assign(ST[KID.val],{fn:'Valentina',ln:'Rivas Méndez',name:'Valentina Rivas Méndez',rep:'Carolina Méndez'});
Object.assign(ST[KID.mat],{fn:'Mateo',ln:'Rivas Méndez',name:'Mateo Rivas Méndez',rep:'Carolina Méndez'});
Object.assign(ST[KID.est],{fn:'Andrés',ln:'Pérez Quintero',name:'Andrés Pérez Quintero',rep:'Luis Pérez'});
const secStudents=id=>ST.slice(id*20,id*20+20);

/* ---------- Finanzas básicas ---------- */
const BANKS=['Banesco','Mercantil','Banco de Venezuela','Provincial','BNC','Bancaribe','Banplus','Bancamiga'];
const METHODS=['Transferencia','Pago móvil'];
const S={
  role:'rep',tab:{rep:'home',doc:'today',est:'home'},kid:'val',docSec:SID.pri4A,docSub:'att',estTab:'home',
  adm:{tab:'queue',li:'',gi:'',si:'',q:'',st:'',page:0,sel:{}},dir:{tab:'sum'},
  mens:50,tasa:100,vence:'25 de octubre',tip:{rep:true,doc:true,est:true,adm:true,dir:true},
  clock:8*60+12,rc:1480,pid:1,
  pay:{},att:{},saved:{},meal:{},nap:{},reads:{},readBy:{},remind:{},
  anns:[],evs:[],tareas:[],ent:{},log:[],openAnn:null,modal:null,
  methodsOn:{'Transferencia':true,'Pago móvil':true}
};
const ST_LABEL={ok:'Al día',rev:'En revisión',part:'Pago parcial',pend:'Pendiente',late:'Atrasado'};
const rcNo=()=>'RC-'+String(++S.rc).padStart(6,'0');
function newPay(sid,o){const p=Object.assign({id:S.pid++,state:'ok'},o);S.pay[sid].pays.push(p);return p}
ST.forEach(s=>{
  const r=R();let st=r<.58?'ok':r<.64?'rev':r<.69?'part':r<.91?'pend':'late';
  if(s.id===KID.val)st='pend';
  if(s.id===KID.mat)st='ok';
  if(s.id===KID.est)st='ok';
  S.pay[s.id]={debt:st==='late'?S.mens:0,pays:[]};
  const method=R()<.55?'Transferencia':'Pago móvil',bank=pick(BANKS);
  const ref=method==='Transferencia'?String(Math.floor(R()*9e9)+1e9):String(Math.floor(R()*9e5)+1e5);
  const tasaP=pick([97.5,98.2,99,99.6,100]);
  if(st==='ok')newPay(s.id,{method,bank,ref,usd:S.mens,tasa:tasaP,bs:S.mens*tasaP,date:pick(['2 oct','3 oct','6 oct','8 oct','10 oct','13 oct']),rc:rcNo()});
  else if(st==='part')newPay(s.id,{method,bank,ref,usd:S.mens/2,tasa:tasaP,bs:S.mens/2*tasaP,date:pick(['7 oct','9 oct','14 oct']),rc:rcNo()});
  else if(st==='rev')newPay(s.id,{method,bank,ref,usd:S.mens,tasa:S.tasa,bs:S.mens*S.tasa,date:pick(['Hoy 7:40 a. m.','Hoy 8:05 a. m.','Ayer 6:12 p. m.','Ayer 9:30 p. m.']),state:'rev'});
});
S.mens=50;
function payInfo(sid){
  const p=S.pay[sid],conf=p.pays.filter(x=>x.state==='ok').reduce((a,x)=>a+x.usd,0),rev=p.pays.some(x=>x.state==='rev');
  const total=S.mens+p.debt,bal=Math.max(0,total-conf);
  let st;
  if(rev)st='rev';else if(bal<=0.001)st='ok';else if(p.debt>0)st='late';else if(conf>0)st='part';else st='pend';
  return{st,debt:p.debt,total,conf,bal,balBs:bal*S.tasa,pays:p.pays,rev:p.pays.filter(x=>x.state==='rev')};
}

/* ---------- Asistencia y bitácora ---------- */
SEC.forEach(sc=>{
  const saved=R()<.85&&sc.id!==SID.pri4A&&sc.id!==SID.pre2A;
  S.saved[sc.id]=saved;
  secStudents(sc.id).forEach(s=>{
    if(!saved){S.att[s.id]=null;S.meal[s.id]=null;S.nap[s.id]=null;return}
    const x=R();S.att[s.id]=x<.91?'P':x<.95?'A':x<.98?'R':'J';
    if(sc.k==='pre'){const y=R();S.meal[s.id]=y<.7?'bien':y<.92?'poco':'no';S.nap[s.id]=R()<.85?'si':'no'}else{S.meal[s.id]=null;S.nap[s.id]=null}
  });
});

/* ---------- Comunicados, agenda y tareas ---------- */
const audLabel=a=>a.t==='all'?'Todo el colegio':a.t==='lv'?LV[a.li].n:a.t==='gr'?(LV[a.li].k==='pre'?'Preescolar ':'')+LV[a.li].g[a.gi]:secName(a.sec);
const audHas=(a,s)=>{const sc=SEC[s.sec];return a.t==='all'||(a.t==='lv'&&sc.li===a.li)||(a.t==='gr'&&sc.li===a.li&&sc.gi===a.gi)||(a.t==='sec'&&sc.id===a.sec)};
const audCount=a=>ST.filter(s=>audHas(a,s)).length;
let annId=1,evId=1,tarId=1;
function addAnn(t,body,aud,by,when,pre){const a={id:annId++,t,body,aud,by,when,pre:!!pre};a.n=audCount(aud);S.reads[a.id]=pre==null?0:Math.floor(a.n*pre);S.anns.unshift(a);return a}
addAnn('Cuidemos el salón de nuestros hijos','Esta semana pedimos a los representantes de preescolar enviar una muda de ropa en la mochila.',{t:'lv',li:0},'Dirección','Lun 19 oct',.62);
addAnn('Entrega de proyectos de ciencias','Los proyectos de bachillerato se entregan el viernes 30 de octubre, de 7:00 a. m. a 12:00 m., en la coordinación.',{t:'lv',li:2},'Dirección','Lun 19 oct',.55);
addAnn('Reunión de representantes de primaria','Jueves 29 de octubre, 5:00 p. m., en el patio central. Asistencia importante.',{t:'lv',li:1},'Dirección','Mar 20 oct',.48);
addAnn('Lectura del capítulo 3 de Ciencias','Los estudiantes de 4to grado A deben leer el capítulo 3 antes del viernes.',{t:'sec',sec:SID.pri4A},'Prof. Luisa Torres','Mar 20 oct',.4);
addAnn('Pago de la mensualidad de octubre','La mensualidad de octubre vence el 25. Puedes reportar tu pago desde la app con transferencia o pago móvil.',{t:'all'},'Administración','Lun 19 oct',.7).rep=true;
// los dos últimos avisos de las familias de ejemplo quedan sin leer
function addEv(title,date,place,aud){S.evs.push({id:evId++,title,date,place,aud})}
addEv('Acto cívico','Vie 23 oct · 8:00 a. m.','Patio central',{t:'all'});
addEv('Reunión de representantes de primaria','Jue 29 oct · 5:00 p. m.','Patio central',{t:'lv',li:1});
addEv('Entrega de proyectos de ciencias','Vie 30 oct · 7:00 a. m.','Coordinación',{t:'lv',li:2});
function addTarea(sec,subj,title,desc,due,by,mat){const t={id:tarId++,sec,subj,title,desc,due,by,mat:mat||[]};S.tareas.push(t);return t}
const T1=addTarea(SID.pri4A,'Ciencias','El ciclo del agua en mi cuaderno','Dibuja el ciclo del agua y escribe tres oraciones sobre cada etapa.','Vie 23 oct','Prof. Luisa Torres',['Guía del ciclo del agua.pdf']);
const T2=addTarea(SID.pri4A,'Matemática','Ejercicios de la página 48','Resuelve los ejercicios 1 al 10. Muestra los pasos.','Lun 26 oct','Prof. Luisa Torres');
const T3=addTarea(SID.bach3B,'Matemática','Taller de ecuaciones de primer grado','Resuelve los ejercicios del taller y entrega en una sola foto o archivo.','Jue 22 oct','Prof. Ramón Peña',['Taller de ecuaciones.pdf']);
const T4=addTarea(SID.bach3B,'Castellano','Resumen del capítulo 5','Resumen de una página con tus propias palabras.','Mar 27 oct','Prof. Ramón Peña');
const LIT=['A','B','C','D','E'];
function seedEnt(t,share){secStudents(t.sec).forEach(s=>{
  if(s.id===KID.val||s.id===KID.est)return;
  if(R()<share){const g=R()<.55;S.ent[t.id+'|'+s.id]={kind:R()<.7?'foto':'archivo',file:R()<.7?'Foto del cuaderno.jpg':'Tarea.pdf',at:pick(['Ayer 4:10 p. m.','Hoy 7:05 a. m.','Ayer 8:42 p. m.']),
    nota:g?(SEC[t.sec].k==='bach'?String(Math.floor(R()*7)+12):pick(['A','A','B','B','C'])):null,comment:g?pick(['Buen trabajo.','Revisa los pasos de la segunda parte.','Muy ordenado, sigue así.']):''}}
})}
seedEnt(T1,.7);seedEnt(T2,.3);seedEnt(T3,.75);seedEnt(T4,.2);

/* ---------- Registro de actividad ---------- */
const clockStr=()=>{let m=S.clock,h=Math.floor(m/60),mm=String(m%60).padStart(2,'0'),ap=h>=12?'p. m.':'a. m.';h=h%12||12;return h+':'+mm+' '+ap};
function logAct(who,what){S.clock+=1+Math.floor(R()*3);S.log.unshift({t:clockStr(),who,what})}
S.log=[
  {t:'7:42 a. m.',who:'Administración',what:'Inició sesión'},
  {t:'7:31 a. m.',who:'Prof. Luisa Torres',what:'Registró asistencia de 5to grado B'},
  {t:'7:18 a. m.',who:'Dirección',what:'Consultó el resumen de pagos'},
  {t:'7:02 a. m.',who:'Sistema',what:'Copia de seguridad diaria completada'},
  {t:'Ayer 6:40 p. m.',who:'Administración',what:'Confirmó un pago y emitió el recibo interno'}
];

/* ---------- Consultas compartidas ---------- */
const kidOf=k=>ST[KID[k]];
const attOf=sid=>S.att[sid];
const myAnns=st=>S.anns.filter(a=>audHas(a.aud,st)&&!(a.rep&&(S.role==='est'||S.role==='doc')));
const myEvs=st=>S.evs.filter(e=>audHas(e.aud,st));
const unreadFor=st=>myAnns(st).filter(a=>!S.readBy[a.id+'|'+st.id]).length;
const tareasOf=sec=>S.tareas.filter(t=>t.sec===sec);
const entOf=(tid,sid)=>S.ent[tid+'|'+sid];
const tStateOf=(t,sid)=>{const e=entOf(t.id,sid);return !e?'pend':e.nota?'ok':'rev'};
function totals(filter){
  const o={n:0,ok:0,rev:0,part:0,pend:0,late:0,cobradoUsd:0,cobradoBs:0,porCobrar:0,metodo:{Transferencia:0,'Pago móvil':0}};
  ST.forEach(s=>{if(filter&&!filter(s))return;const i=payInfo(s.id);o.n++;o[i.st]++;o.porCobrar+=i.bal;
    i.pays.forEach(p=>{if(p.state==='ok'){o.cobradoUsd+=p.usd;o.cobradoBs+=p.bs;o.metodo[p.method]=(o.metodo[p.method]||0)+p.bs}})});
  return o;
}
function attTotals(filter){const o={P:0,A:0,R:0,J:0,none:0,n:0};ST.forEach(s=>{if(filter&&!filter(s))return;o.n++;if(!S.saved[s.sec]){o.none++;return}o[S.att[s.id]||'P']++});return o}

/* ---------- Íconos y piezas comunes ---------- */
const IC={
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',
  bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/>',
  book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
  file:'<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5a3 3 0 0 1 0 6M18 14.8c1.8.7 3 2.4 3 5.2"/>',
  chart:'<path d="M4 20V5M4 20h16M8 16v-4M12 16V8M16 16v-7"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4"/>',
  shield:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2.2 2.2L15 10"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  upload:'<path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M5 19h14"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  cart:'<path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'
};
const ico=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';
const chip=(c,t,plain)=>'<span class="chip '+c+(plain?' plain':'')+'">'+esc(t)+'</span>';
const stChip=s=>chip(s,ST_LABEL[s]);
const etapa=n=>'<span class="etapa e'+n+'">Etapa '+n+'</span>';

/* ---------- Boletín y notas (Etapa 2, vista de ejemplo) ---------- */
const SUBJ={pri:['Castellano','Matemática','Ciencias','Sociales','Inglés','Educación física'],bach:['Matemática','Castellano','Física','Química','Historia','Inglés']};
const mark=(sid,j,k)=>k==='bach'?String(12+((sid*7+j*5)%8)):LIT[((sid+j)%3)];
function gradesCard(st){
  const k=SEC[st.sec].k;
  if(k==='pre')return '<div class="card"><div class="row sb"><h3>Informe descriptivo</h3>'+etapa(2)+'</div><p class="sm" style="margin-top:8px">'+esc(st.fn)+' participa con entusiasmo en las actividades del aula y comparte con sus compañeros. Está desarrollando su autonomía en la rutina diaria.</p><p class="xs muted" style="margin-top:8px">Texto de ejemplo. El formato real lo define el colegio.</p></div>';
  const LP={A:92,B:78,C:62};
  const pm=(j,m)=>{if(k==='bach')return Math.round((12+((st.id*7+j*5+m*3)%8))/20*100);const base=LP[mark(st.id,j,k)];return Math.max(40,Math.min(100,base+((st.id+j*3+m*5)%9)-4))};
  const pr=SUBJ[k].map((s,j)=>({s,sep:pm(j,0),oct:pm(j,1)})),avg=Math.round(pr.reduce((t,x)=>t+x.oct,0)/pr.length),avs=Math.round(pr.reduce((t,x)=>t+x.sep,0)/pr.length);
  const perf='<div class="card"><div class="row sb"><h3>Desempeño de octubre</h3>'+etapa(2)+'</div><div class="row sb" style="margin:8px 0 12px"><div><span class="lbl">Promedio del mes</span><div class="big num">'+avg+'%</div></div><span class="chip '+(avg>=avs?'ok':'pend')+'">'+(avg>=avs?'▲ ':'▼ ')+Math.abs(avg-avs)+' pts vs. septiembre</span></div><div class="list">'+pr.map(x=>{const d=x.oct-x.sep;return '<div class="item" style="display:grid;gap:6px;padding:10px 12px"><div class="row sb"><b class="sm">'+esc(x.s)+'</b><span class="num"><b>'+x.oct+'%</b> <span class="xs" style="color:var(--'+(d>=0?'ok':'late')+')">'+(d>=0?'▲':'▼')+Math.abs(d)+'</span></span></div><div class="prog" role="img" aria-label="'+esc(x.s)+' '+x.oct+' por ciento"><i style="width:'+x.oct+'%"></i></div></div>'}).join('')+'</div><p class="xs muted" style="margin-top:8px">Promedio de las evaluaciones del mes por materia, como porcentaje de la nota máxima. '+(k==='bach'?'Escala de 0 a 20.':'Los literales se convierten a porcentaje con una equivalencia de ejemplo.')+' Datos y método ilustrativos, por definir con el colegio.</p></div>';
  const rows=SUBJ[k].map((s,j)=>'<tr><td>'+esc(s)+'</td><td class="r b num">'+mark(st.id,j,k)+'</td></tr>').join('');
  return perf+'<div class="card"><div class="row sb"><h3>Boletín de ejemplo</h3>'+etapa(2)+'</div><div class="tw" style="margin-top:8px"><table class="tbl" style="min-width:0"><thead><tr><th>Materia</th><th class="r">'+(k==='bach'?'Nota (0 a 20)':'Literal')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="xs muted" style="margin-top:8px">Vista previa ilustrativa. Las escalas, lapsos y formato del boletín se configuran con el colegio y no están verificados.</p></div>';
}

    case'close':closeSheet();break;
    case'soon':toast(d.v||'Disponible en la versión real.');break;
    case'ann':{const id=+d.a,key=id+'|'+d.s;S.openAnn=S.openAnn===id?null:id;if(!S.readBy[key]){S.readBy[key]=1;S.reads[id]++}reread();break}
    case'tarea':openSheet(tareaSheet(+d.t,+d.s));break;
    case'att':S.att[+d.s]=d.v;reread();break;
    case'attall':secStudents(S.docSec).forEach(s=>{S.att[s.id]='P'});reread();break;
    case'attsave':{const sts=secStudents(S.docSec),miss=sts.filter(s=>!S.att[s.id]).length;
      if(miss){toast('Faltan '+miss+' estudiantes por marcar');break}
      S.saved[S.docSec]=true;logAct('Docente','Registró asistencia de '+secName(S.docSec));toast('Registro guardado. Dirección y las familias ya lo ven.');reread();break}
    case'dsub':S.docSub=d.v;reread();break;
    case'meal':S.meal[+d.s]=d.v;reread();break;
    case'nap':S.nap[+d.s]=d.v;reread();break;
    case'secform':openSheet(secForm());break;
    case'secgo':{const l=+$('#ds-l').value,g=+$('#ds-g').value,s=$('#ds-s').value;S.docSec=SEC.find(x=>x.li===l&&x.gi===g&&x.s===s).id;S.tab.doc='today';S.docSub='att';closeSheet();render();break}
    case'tnew':openSheet(tnewSheet());break;
    case'tdet':openSheet(tdetSheet(+d.t));break;
    case'ent':openSheet(entSheet(+d.t,+d.s));break;
    case'dtab':S[d.r].tab=d.v;if(d.r==='dir')S.dir.fid=null;if(d.r==='adm'){S.adm.page=0;S.adm.st='';S.adm.sel={}}render();break;
    case'page':S.adm.page=+d.v;render();break;
    case'lst':S.adm.lst=d.v;S.adm.page=0;reread();break;
    case'proof':openSheet(proofSheet(+d.s,+d.p));break;
    case'conf':openSheet(confSheet(+d.s,+d.p));break;
    case'rej':openSheet(rejSheet(+d.s,+d.p));break;
    case'bulk':openSheet(bulkSheet());break;
    case'acct':openSheet(acctSheet(+d.s));break;
    case'manual':openSheet(manualForm(+d.s));break;
    case'rem':openSheet(remSheet(+d.s));break;
    case'remsend':{const s=ST[+d.s];S.remind[s.id]=remMsg(s);logAct('Administración','Envió un recordatorio de pago a '+s.rep);closeSheet();toast('Recordatorio enviado dentro de la app');reread();break}
    case'remall':{const rows=ST.filter(s=>matchF(s,Object.assign({},S.adm,{st:S.adm.lst||'late'})));rows.forEach(s=>{S.remind[s.id]=remMsg(s)});logAct('Administración','Envió '+rows.length+' recordatorios de pago');toast(rows.length+' recordatorios enviados dentro de la app');reread();break}
    case'ficha':S.dir.fid=+d.s;S.dir.ft='res';S.dir.tab='find';closeSheet();render();break;
    case'fback':S.dir.fid=null;render();break;
    case'ftab':S.dir.ft=d.v;reread();break;
    case'cform':openSheet(cformSheet(+d.k));break;
    case'cscan':S.cs.sid=+d.s;S.cs.cart={};S.cs.err='';S.cs.q='';render();break;
    case'cclear':S.cs.sid=null;S.cs.cart={};S.cs.err='';render();break;
    case'cadd':S.cs.cart[d.p]=(S.cs.cart[d.p]||0)+1;S.cs.err='';reread();break;
    case'csub':S.cs.cart[d.p]=Math.max(0,(S.cs.cart[d.p]||0)-1);if(!S.cs.cart[d.p])delete S.cs.cart[d.p];S.cs.err='';reread();break;
    case'ccobrar':{const s=ST[S.cs.sid],c=cantOf(s.id),tot=cartTotal();
      if(!tot)break;
      if(tot>c.saldo){S.cs.err='Saldo insuficiente: faltan '+bs(tot-c.saldo)+'.';reread();break}
      S.clock+=2;const desc=cartDesc();c.saldo-=tot;c.movs.unshift({t:'Hoy · '+clockStr(),d:desc,a:-tot});S.sales.push({sid:s.id,a:tot,d:desc,t:clockStr()});
      logAct('Cantina','Cobró '+bs(tot)+' a '+s.fn);S.cs.sid=null;S.cs.cart={};S.cs.err='';toast('Venta registrada. Saldo de '+s.fn+': '+bs(c.saldo));render();break}
    case'cpconf':{const r=S.crec.find(x=>x.id===+d.r),c=cantOf(r.sid);r.state='ok';c.saldo+=r.bs;c.movs.unshift({t:'Hoy · '+clockStr(),d:'Recarga confirmada',a:r.bs});logAct('Administración','Confirmó una recarga de cantina de '+ST[r.sid].fn);toast('Recarga confirmada. Saldo acreditado.');render(true);break}
    case'cprej':{const r=S.crec.find(x=>x.id===+d.r);r.state='rej';logAct('Administración','Rechazó una recarga de cantina de '+ST[r.sid].fn);toast('Recarga rechazada.');render(true);break}
    case'seeas':S.docSec=+d.v;S.tab.doc='today';S.docSub='att';S.role='doc';render();break;
    case'backup':logAct('Dirección','Generó un respaldo descargable');toast('Demo: el respaldo real se descarga como archivo cifrado.');reread();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeSheet()});
document.addEventListener('change',e=>{
  const t=e.target,A=S.adm;
  switch(t.id){
    case'ds-l':{const g=$('#ds-g'),l=+t.value;g.innerHTML=LV[l].g.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('');return}
    case'fl-l':A.li=t.value;A.gi='';A.page=0;A.sel={};render(true);return;
    case'fl-g':A.gi=t.value;A.page=0;render(true);return;
    case'fl-s':A.si=t.value;A.page=0;render(true);return;
    case'fl-t':A.st=t.value;A.page=0;render(true);return;
    case'an-t':audSync('an');return;case'an-l':fillGrades('an');return;
    case'ev-t':audSync('ev');return;case'ev-l':fillGrades('ev');return;
  }
  if(t.dataset.ch==='sel'){A.sel[t.dataset.k]=t.checked;render(true)}
  if(t.dataset.ch==='meth'){S.methodsOn[t.dataset.v]=t.checked;if(!METHODS.some(m=>S.methodsOn[m])){S.methodsOn[t.dataset.v]=true;toast('Debe quedar al menos un método activo')}reread()}
});
let qT,dqT;
document.addEventListener('input',e=>{if(e.target.id!=='dq')return;clearTimeout(dqT);const v=e.target.value;dqT=setTimeout(()=>{S.dir.q=v;render(true);const q=$('#dq');if(q){q.focus();q.setSelectionRange(v.length,v.length)}},220)});
document.addEventListener('input',e=>{
  if(e.target.id!=='fl-q')return;
  clearTimeout(qT);const v=e.target.value;
  qT=setTimeout(()=>{S.adm.q=v;S.adm.page=0;render(true);const q=$('#fl-q');if(q){q.focus();q.setSelectionRange(v.length,v.length)}},260);
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,d=f.dataset,v=id=>($('#'+id)||{}).value||'';
  switch(f.id){
    case'f-pay':{
      const kid=+d.kid,i=payInfo(kid),ref=v('pf-r').trim(),amt=numLoose(v('pf-a')),err=$('#pf-e');
      if(!/^\d{4,12}$/.test(ref)){err.textContent='La referencia debe tener entre 4 y 12 números.';return}
      if(!(amt>0)){err.textContent='Escribe el monto que pagaste en bolívares.';return}
      if(amt>i.balBs*1.005){err.textContent='El monto supera el saldo ('+bs(i.balBs)+').';return}
      S.clock+=2;newPay(kid,{method:v('pf-m'),bank:v('pf-b'),ref,usd:amt/S.tasa,tasa:S.tasa,bs:amt,date:'Hoy '+clockStr(),state:'rev'});
      logAct('Carolina Méndez (representante)','Reportó un pago de '+bs(amt)+' de '+ST[kid].fn);
      closeSheet();toast('Pago enviado a revisión. Te avisamos cuando se confirme.');reread();break}
    case'f-crec':{const kid=+d.kid,ref=v('cr-r').trim(),amt=numLoose(v('cr-a')),err=$('#cr-e');
      if(!/^\d{4,12}$/.test(ref)){err.textContent='La referencia debe tener entre 4 y 12 números.';return}
      if(!(amt>=50)){err.textContent='El monto mínimo de recarga es Bs 50.';return}
      S.clock+=2;S.crec.push({id:S.crid++,sid:kid,method:v('cr-m'),bank:v('cr-b'),ref,bs:amt,date:'Hoy '+clockStr(),state:'rev'});
      logAct('Carolina Méndez (representante)','Reportó una recarga de cantina de '+bs(amt)+' para '+ST[kid].fn);closeSheet();toast('Recarga enviada a revisión. Se acredita al confirmar.');reread();break}
    case'f-cq':{S.cs.q=v('cq-q').trim();reread();break}
    case'f-ent':{const t=+d.t,s=+d.s,k=v('en-k');S.ent[t+'|'+s]={kind:k,file:k==='foto'?'Foto del cuaderno.jpg':'Tarea.pdf',at:'Hoy '+clockStr(),nota:null,comment:''};
      logAct(ST[s].fn+' (entrega)','Entregó "'+S.tareas.find(x=>x.id===t).title+'"');closeSheet();toast('Entrega enviada. Tu docente la verá en su lista.');reread();break}
    case'f-tnew':{const ti=v('tn-t').trim(),err=$('#tn-e');if(!ti){err.textContent='Escribe un título para la tarea.';return}
      addTarea(S.docSec,v('tn-s'),ti,v('tn-d').trim()||'Sin instrucciones adicionales.',v('tn-f').trim()||'Sin fecha','Prof. Luisa Torres',$('#tn-m').checked?['Guía de la tarea.pdf']:[]);
      S.tab.doc='hw';logAct('Docente','Publicó la tarea "'+ti+'" en '+secName(S.docSec));closeSheet();toast('Tarea publicada. Las familias de la sección ya la ven.');reread();break}
    case'f-gr':{const t=+d.t,s=+d.s,e2=entOf(t,s),bach=SEC[ST[s].sec].k==='bach',n=v('gr-n').trim(),err=$('#gr-e');
      if(bach){if(!/^\d{1,2}$/.test(n)||+n>20){err.textContent='La nota debe estar entre 0 y 20.';return}}else if(!n){err.textContent='Elige un literal.';return}
      e2.nota=n;e2.comment=v('gr-c').trim()||'Sin comentarios.';logAct('Docente','Calificó la entrega de '+ST[s].fn);closeSheet();toast('Calificación guardada. El estudiante y su familia la ven.');reread();break}
    case'f-ann':{const ti=v('an-ti').trim(),b=v('an-b').trim(),err=$('#an-e');if(!ti||!b){err.textContent='Escribe el título y el mensaje.';return}
      const a=addAnn(ti,b,readAud('an'),'Dirección','Hoy',0);if($('#an-rep').checked)a.rep=true;logAct('Dirección','Publicó el comunicado "'+ti+'" para '+audLabel(a.aud));toast('Comunicado publicado para '+audLabel(a.aud)+' ('+a.n+' familias).');render();break}
    case'f-ev':{const ti=v('ev-t').trim(),err=$('#ev-e');if(!ti){err.textContent='Escribe el título del evento.';return}
      const aud=readAud('ev');S.evs.push({id:evId++,title:ti,date:v('ev-d').trim()||'Por definir',place:v('ev-p').trim()||'Por definir',aud});
      logAct('Dirección','Agregó el evento "'+ti+'"');toast('Evento agregado a la agenda.');render();break}
    case'f-tasa':{const n=numLoose(v('ta-v')),err=$('#ta-e');if(!(n>0&&n<100000)){err.textContent='Escribe una tasa válida.';return}
      S.tasa=n;logAct('Dirección','Actualizó la tasa de ejemplo a Bs '+fnum(n));toast('Tasa actualizada. Los pagos confirmados conservan la suya.');render();break}
    case'f-conf':{const t=numLoose(v('cf-t')),err=$('#cf-e');if(!(t>0)){err.textContent='Escribe la tasa aplicada.';return}
      if(!$('#cf-v').checked){err.textContent='Confirma que verificaste la referencia en el banco.';return}
      confirmPay(+d.s,+d.p,t,v('cf-i').trim());closeSheet();toast('Pago confirmado. Se emitió el recibo interno.');reread();break}
    case'f-rej':{const p=findPay(+d.s,+d.p);p.state='rej';p.motivo=v('rj-m');delete S.adm.sel[d.s+'|'+d.p];logAct('Administración','Rechazó un pago de '+ST[+d.s].fn+' ('+p.motivo+')');closeSheet();toast('Pago rechazado. El representante verá el motivo.');reread();break}
    case'f-bulk':{if(!$('#bk-v').checked){$('#bk-e').textContent='Confirma que verificaste las referencias.';return}
      const keys=Object.keys(S.adm.sel).filter(k=>S.adm.sel[k]);keys.forEach(k=>{const [a,b]=k.split('|'),p=findPay(+a,+b);confirmPay(+a,+b,p.tasa,'')});
      closeSheet();toast(keys.length+' pagos confirmados.');reread();break}
    case'f-manual':{const sid=+d.s,ref=v('mp-r').trim(),amt=numLoose(v('mp-a')),err=$('#mp-e');
      if(!/^\d{4,12}$/.test(ref)){err.textContent='La referencia debe tener entre 4 y 12 números.';return}
      if(!(amt>0)){err.textContent='Escribe el monto en bolívares.';return}
      const p=newPay(sid,{method:v('mp-m'),bank:v('mp-b'),ref,usd:amt/S.tasa,tasa:S.tasa,bs:amt,date:'Hoy '+clockStr(),state:'ok',rc:rcNo()});const inv=v('mp-i').trim();if(inv)p.inv=inv;
      logAct('Administración','Registró un pago de '+ST[sid].fn+' y emitió el recibo '+p.rc);closeSheet();toast('Pago registrado y confirmado.');reread();break}
  }
});

/* ---------- Inicio ---------- */
render();

</script>
</body>
